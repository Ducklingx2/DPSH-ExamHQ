
[package]
name = "examhq"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
serde_json = "1"
dotenvy = "0.15"
tracing = "0.1"

[dependencies.tokio]
version = "1"
features = ["macros", "rt-multi-thread", "net"]

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.sqlx]
version = "0.8"
default-features = false
features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "macros"
]

[dependencies.reqwest]
version = "0.12"
default-features = false
features = ["json", "rustls-tls"]

[dependencies.chrono]
version = "0.4"
features = ["serde"]

[dependencies.uuid]
version = "1"
features = ["serde", "v4"]

[dependencies.tower-http]
version = "0.6"
features = ["fs", "trace"]

[dependencies.tracing-subscriber]
version = "0.3"
features = ["env-filter"]
